<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover — обязателен, чтобы работали safe-area-inset на устройствах с вырезом.
         maximum-scale=1 + user-scalable=no — приложение не масштабируется жестом:
         это Mini App, а не веб-страница, и «щипок» ломал бы фиксированную вёрстку. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#0D0E12" />
    <title>Budget Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js?57"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
