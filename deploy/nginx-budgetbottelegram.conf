# Budget Manager — Telegram Mini App.
# Один origin: статика фронта и /api с одного домена, поэтому CORS не нужен.

server {
    listen 80;
    listen [::]:80;
    server_name budgetbottelegram.duckdns.org;

    # HTTP оставлен только под продление сертификата; Telegram работает лишь по https.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name budgetbottelegram.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/budgetbottelegram.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/budgetbottelegram.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/budget-manager;
    index index.html;

    # Mini App открывается во фрейме Telegram — DENY здесь сломал бы вход.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 1m;

    # Хэшированные ассеты неизменяемы — кэшируем надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        access_log off;
    }

    # SPA: любой маршрут отдаёт index.html, но сам он не кэшируется,
    # иначе после деплоя пользователь останется на старых ассетах.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
